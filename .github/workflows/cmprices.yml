name: cmprices
on:
  workflow_dispatch:
  schedule:
    - cron: "40 5 * * *"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .cache
          key: tcgdex-cm-${{ github.run_id }}
          restore-keys: tcgdex-cm-
      - name: cmprices.json bauen (offizielle Cardmarket-Preisdatei, Zuordnung nur über TCGdex-idProduct)
        run: python3 tools/build_cmprices.py
      - name: Commit, wenn geändert
        run: |
          git diff --quiet cmprices.json && exit 0
          git config user.name jayezhdtwitch
          git config user.email jayezhdtwitch@users.noreply.github.com
          git add cmprices.json
          git commit -m "cmprices.json aktualisiert (tools/build_cmprices.py)"
          git pull --rebase
          git push
