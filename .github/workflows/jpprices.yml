name: jpprices
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: jpprices
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/build_jpprices.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- jpprices.json; then echo "keine Änderung"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add jpprices.json
          git commit -m "jpprices: Tagesupdate $(date -u +%F)"
          git pull --rebase
          git push
