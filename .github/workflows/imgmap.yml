name: imgmap
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: imgmap.json bauen
        env:
          SCRYDEX_API_KEY: ${{ secrets.SCRYDEX_API_KEY }}
          SCRYDEX_TEAM_ID: ${{ secrets.SCRYDEX_TEAM_ID }}
        run: python3 tools/build_imgmap.py
      - name: Commit, wenn geändert
        run: |
          git diff --quiet imgmap.json && exit 0
          git config user.name jayezhdtwitch
          git config user.email jayezhdtwitch@users.noreply.github.com
          git add imgmap.json
          git commit -m "imgmap.json aktualisiert (tools/build_imgmap.py)"
          git pull --rebase
          git push
